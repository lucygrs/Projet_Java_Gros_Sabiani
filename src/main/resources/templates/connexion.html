<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/gabarit :: entete('Connexion')}"></head>
<body class="bg-fond font-sans text-texte">
<div class="flex min-h-screen">
    <div class="relative w-1/2 overflow-hidden bg-[#F5F7F3]">
        <img class="absolute left-0 top-[23%] max-w-none" th:src="@{/images/train-vert.svg}" alt="">
        <img class="absolute left-0 top-[58%] max-w-none" th:src="@{/images/train-rose.svg}" alt="">
    </div>
    <main class="flex w-1/2 flex-col justify-center px-[150px]">
        <img class="mb-10 w-[132px]" th:src="@{/images/logo.svg}" alt="IDFLM">
        <span class="text-xs text-vert-fonce">Bienvenue</span>
        <h1 class="mb-7 text-[22px] font-semibold">Connectez vous pour continuer</h1>
        <p class="mb-4 text-sm text-erreur" th:if="${param.erreur}">Identifiant ou mot de passe incorrect</p>
        <p class="mb-4 text-sm text-vert-fonce" th:if="${param.deconnecte}">Vous êtes déconnecté</p>
        <form th:action="@{/connexion}" method="post">
            <div class="mb-4">
                <label class="libelle" for="identifiant">Identifiant unique</label>
                <input class="champ-saisie" id="identifiant" name="identifiant" placeholder="danidu75"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="libelle" for="motDePasse">Mot de passe</label>
                <input class="champ-saisie" id="motDePasse" name="motDePasse" type="password" placeholder="********"
                       autocomplete="current-password" required>
            </div>
            <div class="mt-2.5 flex justify-end">
                <button class="bouton-principal" type="submit">Se connecter</button>
            </div>
        </form>
    </main>
</div>
</body>
</html>
