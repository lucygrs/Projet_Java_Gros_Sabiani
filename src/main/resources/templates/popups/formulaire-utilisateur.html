<div xmlns:th="http://www.thymeleaf.org" th:remove="tag">
    <th:block th:replace="~{fragments/gabarit :: entetePopup(${idUtilisateur} ? 'Modifier le compte' : 'Ajouter un compte')}"></th:block>
    <form th:action="${idUtilisateur} ? @{/utilisateurs/{id}(id=${idUtilisateur})} : @{/utilisateurs}"
          th:method="${idUtilisateur} ? 'put' : 'post'" data-formulaire-popup>
        <div class="mb-4">
            <label class="libelle" for="prenom">Prénom</label>
            <input class="champ-saisie" id="prenom" name="prenom" maxlength="100" required th:value="${formulaire.prenom()}">
        </div>
        <div class="mb-4">
            <label class="libelle" for="nom">Nom</label>
            <input class="champ-saisie" id="nom" name="nom" maxlength="100" required th:value="${formulaire.nom()}">
        </div>
        <div class="mb-4">
            <label class="libelle" for="identifiant">Identifiant</label>
            <input class="champ-saisie" id="identifiant" name="identifiant" maxlength="100" required autocomplete="off"
                   th:value="${formulaire.identifiant()}">
        </div>
        <div class="mb-4">
            <label class="libelle" for="motDePasse"
                   th:text="${idUtilisateur} ? 'Nouveau mot de passe (laisser vide pour le conserver)' : 'Mot de passe'">Mot de passe</label>
            <input class="champ-saisie" id="motDePasse" name="motDePasse" type="password" maxlength="72"
                   autocomplete="new-password" th:required="${idUtilisateur == null}">
        </div>
        <div class="mb-4">
            <label class="libelle" for="profil">Rôle</label>
            <select class="champ-saisie" id="profil" name="profil" required>
                <option th:each="profil : ${profils}" th:value="${profil}" th:text="${profil.libelle}"
                        th:selected="${profil == formulaire.profil()}">Profil</option>
            </select>
        </div>
        <div class="mt-2.5 flex justify-end gap-2.5">
            <button class="bouton-secondaire" type="button" data-fermer-popup>Annuler</button>
            <button class="bouton-principal" type="submit">Enregistrer</button>
        </div>
    </form>
</div>
