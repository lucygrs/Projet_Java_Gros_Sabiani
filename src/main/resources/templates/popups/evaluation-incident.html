<div xmlns:th="http://www.thymeleaf.org" th:remove="tag">
    <th:block th:replace="~{fragments/gabarit :: entetePopup('Evaluation de l’intervention')}"></th:block>
    <p class="mb-4 text-secondaire" th:text="|#${incident.id} · ${incident.titre}|">Incident</p>
    <dl class="mb-4 grid grid-cols-[170px_1fr] gap-x-4 gap-y-2" th:if="${evaluation}">
        <dt class="text-secondaire">Prestataire</dt>
        <dd th:text="${incident.prestataire?.nom}">Prestataire</dd>
        <dt class="text-secondaire">Note</dt>
        <dd><span th:replace="~{fragments/gabarit :: etoiles(${evaluation.note})}"></span></dd>
        <dt class="text-secondaire">Commentaire</dt>
        <dd th:text="${evaluation.commentaire} ?: 'Aucun commentaire'">Commentaire</dd>
        <dt class="text-secondaire">Date</dt>
        <dd th:text="${#temporals.format(evaluation.dateEvaluation, 'd MMMM yyyy à HH:mm')}">Date</dd>
    </dl>
    <p class="mb-4" th:unless="${evaluation}">Cet incident n’a pas été évalué.</p>
    <div class="flex justify-end">
        <button class="bouton-principal" type="button" data-fermer-popup>Fermer</button>
    </div>
</div>
