<div xmlns:th="http://www.thymeleaf.org" th:remove="tag">
    <button class="absolute right-5 top-5 cursor-pointer text-lg" type="button" data-fermer-popup title="Fermer">
        <i class="bi bi-x-lg"></i>
    </button>
    <h2 class="mb-4 text-[22px] font-medium"
        th:text="${status == 404} ? 'Introuvable' : (${status == 500} ? 'Erreur' : 'Action impossible')">Action impossible</h2>
    <p class="text-sm text-erreur" th:text="${message}">Message</p>
    <div class="mt-4 flex justify-end">
        <button class="bouton-principal" type="button" data-fermer-popup>Fermer</button>
    </div>
</div>
